<title>微信 · 登录 / 注册</title>
<style>
  :root {
    --wx-green: #07c160;
    --wx-green-dark: #06a850;
    --wx-green-soft: #e8f8ef;
    --text-main: #1a1a1a;
    --text-sub: #9a9a9a;
    --line: #ededed;
    --bg-input: #f6f6f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #eafaf1 0%, #f2f3f5 45%, #e9ebef 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text-main);
    padding: 24px;
  }

  /* ===== 手机外壳 ===== */
  .phone {
    width: 375px;
    height: 812px;
    background: #0c0c0e;
    border-radius: 46px;
    padding: 13px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.45), 0 0 0 2px #2a2a2e;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 13px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 26px;
    background: #0c0c0e; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
    z-index: 5;
  }
  .screen {
    width: 100%; height: 100%;
    background: #f7f8fa;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    font-size: 14px; font-weight: 600;
    color: #1a1a1a;
    flex-shrink: 0;
  }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar svg { display: block; }

  /* ===== 内容区 ===== */
  .app {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 28px 24px;
    overflow-y: auto;
  }

  .logo {
    margin-top: 26px;
    width: 76px; height: 76px;
    filter: drop-shadow(0 8px 14px rgba(7,193,96,.28));
    animation: pop .5s ease;
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .brand {
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
    margin-top: 10px; color: #1a1a1a;
  }
  .slogan { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

  /* ===== 切换标签 ===== */
  .tabs {
    position: relative;
    display: flex;
    margin-top: 34px;
    background: #fff;
    border-radius: 999px;
    padding: 5px;
    width: 100%;
    box-shadow: 0 4px 14px rgba(0,0,0,.04);
  }
  .tab {
    flex: 1;
    border: none; background: transparent;
    padding: 11px 0; font-size: 15px; font-weight: 600;
    color: #666; cursor: pointer; position: relative; z-index: 2;
    transition: color .25s;
  }
  .tab.active { color: #fff; }
  .tab-indicator {
    position: absolute; top: 5px; left: 5px;
    width: calc(50% - 5px); height: calc(100% - 10px);
    background: var(--wx-green);
    border-radius: 999px;
    transition: transform .3s cubic-bezier(.4,1.3,.5,1);
    z-index: 1;
  }
  .tabs.register .tab-indicator { transform: translateX(100%); }

  /* ===== 表单 ===== */
  .form {
    width: 100%;
    margin-top: 26px;
    display: none;
    animation: fade .35s ease;
  }
  .form.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .field {
    display: flex; align-items: center;
    background: var(--bg-input);
    border-radius: 12px;
    padding: 0 14px;
    height: 50px;
    margin-bottom: 14px;
    transition: box-shadow .2s, background .2s;
  }
  .field:focus-within { background: #fff; box-shadow: 0 0 0 1.5px var(--wx-green); }
  .field .prefix { font-size: 15px; color: #333; font-weight: 600; padding-right: 10px; }
  .field .sep { width: 1px; height: 20px; background: #dcdcdc; margin-right: 12px; }
  .field input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 15px; color: #1a1a1a;
  }
  .field input::placeholder { color: #b5b5b5; }

  .code-btn {
    border: none; background: transparent; color: var(--wx-green);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    padding-left: 10px;
  }
  .code-btn:disabled { color: #b5b5b5; cursor: not-allowed; }

  .eye {
    border: none; background: transparent; cursor: pointer;
    color: #b5b5b5; font-size: 18px; padding: 0 2px;
    display: flex; align-items: center;
  }

  .btn-primary {
    width: 100%; height: 50px; border: none; border-radius: 12px;
    background: var(--wx-green); color: #fff;
    font-size: 16px; font-weight: 600; letter-spacing: 2px;
    cursor: pointer; margin-top: 8px;
    transition: background .2s, transform .08s;
    box-shadow: 0 8px 18px -6px rgba(7,193,96,.5);
  }
  .btn-primary:hover { background: var(--wx-green-dark); }
  .btn-primary:active { transform: scale(.98); }

  .row-links {
    display: flex; justify-content: space-between;
    margin-top: 16px; font-size: 13px;
  }
  .row-links a { color: #576b95; text-decoration: none; cursor: pointer; }
  .row-links a:hover { text-decoration: underline; }

  .agree {
    display: flex; align-items: flex-start; gap: 8px;
    margin-top: 18px; font-size: 12px; color: #888; line-height: 1.5;
  }
  .agree input { margin-top: 2px; accent-color: var(--wx-green); width: 15px; height: 15px; }
  .agree a { color: #576b95; text-decoration: none; }

  .switch-mode {
    text-align: center; margin-top: 18px; font-size: 13px; color: #888;
  }
  .switch-mode span { color: var(--wx-green); font-weight: 600; cursor: pointer; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 30px 0 18px; color: #c5c5c5; font-size: 12px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .more-login { display: flex; justify-content: center; gap: 26px; }
  .more-login .ic {
    width: 46px; height: 46px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.05); cursor: pointer; font-size: 20px;
    transition: transform .15s;
  }
  .more-login .ic:hover { transform: translateY(-3px); }

  .footer {
    margin-top: auto; padding-top: 16px;
    font-size: 11px; color: #c0c0c0; text-align: center;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(.9);
    background: rgba(0,0,0,.82); color: #fff;
    padding: 14px 22px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 99; text-align: center; max-width: 280px;
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  .home-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }
  .home-screen.show { display: flex; }
  .home-screen .big-logo { width: 90px; filter: drop-shadow(0 10px 18px rgba(7,193,96,.3)); }
  .home-screen .hi { font-size: 18px; font-weight: 600; color: #1a1a1a; }

  ::-webkit-scrollbar { width: 0; }
</style>

<script>
  // ===== 时钟 =====
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick(); setInterval(tick, 10000);

  // ===== Toast =====
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg, ms = 1800) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
  }

  // ===== 标签切换 =====
  const tabs = document.getElementById('tabs');
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tabs.classList.toggle('register', target === 'register');
      document.getElementById('loginForm').classList.toggle('active', target === 'login');
      document.getElementById('registerForm').classList.toggle('active', target === 'register');
    });
  });

  // ===== 显示/隐藏密码 =====
  document.querySelectorAll('.eye').forEach(eye => {
    eye.addEventListener('click', () => {
      const inp = document.getElementById(eye.dataset.target);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      eye.textContent = inp.type === 'password' ? '👁' : '🙈';
    });
  });

  // ===== 手机号校验 =====
  const phoneRe = /^1[3-9]\d{9}$/;
  function getPhone(id) {
    return (document.getElementById(id).value || '').trim();
  }

  // ===== 获取验证码（倒计时）=====
  document.querySelectorAll('.code-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const phone = getPhone(btn.dataset.phone);
      if (!phoneRe.test(phone)) { showToast('请输入正确的手机号'); return; }
      let left = 60;
      btn.disabled = true;
      btn.textContent = left + 's 后重发';
      showToast('验证码已发送（演示：任意6位数字）');
      const timer = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
        else btn.textContent = left + 's 后重发';
      }, 1000);
    });
  });

  // ===== 登录：密码 / 验证码模式切换 =====
  const loginPwdField = document.getElementById('loginPwdField');
  const loginCodeField = document.getElementById('loginCodeField');
  const loginSwitchMode = document.getElementById('loginSwitchMode');
  let loginUseCode = false;
  loginSwitchMode.addEventListener('click', () => {
    loginUseCode = !loginUseCode;
    loginPwdField.style.display = loginUseCode ? 'none' : 'flex';
    loginCodeField.style.display = loginUseCode ? 'flex' : 'none';
    loginSwitchMode.textContent = loginUseCode ? '用密码登录' : '用短信验证码登录';
  });

  // ===== 提交：登录 =====
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = getPhone('loginPhone');
    if (!phoneRe.test(phone)) { showToast('请输入正确的手机号'); return; }
    if (loginUseCode) {
      const code = (document.getElementById('loginCode').value || '').trim();
      if (!/^\d{6}$/.test(code)) { showToast('请输入6位验证码'); return; }
    } else {
      const pwd = document.getElementById('loginPwd').value;
      if (pwd.length < 6) { showToast('密码至少6位'); return; }
    }
    showToast('登录成功，正在进入…', 1200);
    setTimeout(() => {
      document.getElementById('app').style.display = 'none';
      const home = document.getElementById('homeScreen');
      home.classList.add('show');
      document.getElementById('welcomeText').textContent = '欢迎回来，' + phone;
    }, 1200);
  });

  // ===== 提交：注册 =====
  document.getElementById('registerForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = getPhone('regPhone');
    if (!phoneRe.test(phone)) { showToast('请输入正确的手机号'); return; }
    const code = (document.getElementById('regCode').value || '').trim();
    if (!/^\d{6}$/.test(code)) { showToast('请输入6位验证码'); return; }
    const pwd = document.getElementById('regPwd').value;
    const pwd2 = document.getElementById('regPwd2').value;
    if (pwd.length < 6 || pwd.length > 20) { showToast('密码需为6-20位'); return; }
    if (pwd !== pwd2) { showToast('两次密码不一致'); return; }
    if (!document.getElementById('agree').checked) { showToast('请先同意服务协议'); return; }
    showToast('注册成功，请登录 🎉', 1600);
    setTimeout(() => {
      document.querySelector('.tab[data-tab="login"]').click();
      document.getElementById('loginPhone').value = phone;
      document.getElementById('registerForm').reset();
    }, 1600);
  });
</script>
</body>
</html>
